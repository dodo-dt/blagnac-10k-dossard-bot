name: monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_whatsapp:
        description: "Envoyer un message de test (WhatsApp / Telegram)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
      TELEGRAM_USER: ${{ secrets.TELEGRAM_USER }}
      BROWSER_CHANNEL: chrome # Chrome préinstallé sur ubuntu-latest
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python test_monitor.py
      - if: ${{ inputs.test_whatsapp }}
        continue-on-error: true
        run: python monitor.py --test-whatsapp
      - run: python monitor.py
      - name: Persister state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update state [skip ci]"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME" || true
          git push
